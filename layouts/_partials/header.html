<header>
    <a href="{{ "/" | relURL }}">
        <img src="{{ "img/header/header2.JPG" | relURL }}" style="width: 100%; height: auto;">
    </a>
    {{ partial "lang-switch.html" . }}
    <!--h1 class="site-title">www.{{ (urls.Parse site.BaseURL).Hostname }}</h1-->
    <h1 class="page-title">
        {{ if .Title }}
            {{ .Title }}
        {{ else }}
            {{ .Site.Title }}
        {{ end }}
    </h1>
    <h5 class="page-title-post-date post-date">({{ .Date.Format "2006.01.02" }})</h5>
    
</header>
