{{ if not .IsHome }}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    {{ if not .IsHome }}
      <li class="breadcrumb-item">
        <a href="/">Home</a>
      </li>
      {{ range .Ancestors.Reverse }}
        {{ if not .IsHome }}
          <li class="breadcrumb-item">
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          </li>
        {{ end }}
      {{ end }}
      <li class="breadcrumb-item active" aria-current="page">
        {{ .Title }}
      </li>
    {{ end }}
  </ol>
</nav>
{{ end }}
