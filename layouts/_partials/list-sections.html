{{ range . }}
  <details class="post-collapsable-list">
      <summary class="post-list-item">
        <a class="post-list-item-title-link" href="{{ .RelPermalink }}">{{ .Title | humanize | title }}</a>
      </summary>
    {{ partial "list-sections.html" .Sections }}

    {{ partial "list-pages.html" . }}
  </details>
{{ end }}
